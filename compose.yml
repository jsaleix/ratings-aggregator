services:
    postgres:
        image: postgres:15
        container_name: postgres_db
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            POSTGRES_DB: aggregator
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:7
        container_name: redis_cache
        command: ["redis-server", "--requirepass", "root"]
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

    adminer:
        image: adminer
        ports:
            - "8080:8080"
        depends_on:
            - postgres

    api:
        build:
            context: ./apps/api
            dockerfile: ../../docker/api/Dockerfile
            target: dev
        ports:
            - "3000:3000"
        depends_on:
            - postgres
            - redis
        volumes:
            - /app

    worker:
        build:
            context: ./apps/worker
            dockerfile: ../../docker/worker/Dockerfile
        depends_on:
            - postgres
            - redis
        volumes:
            - ./apps/worker:/app

volumes:
    postgres_data:
    redis_data:
    api_data:
    worker_data:
