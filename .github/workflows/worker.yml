name: Worker CI
on:
    push:
        paths:
            - "apps/worker/**"
    pull_request:
        paths:
            - "apps/worker/**"

jobs:
    build:
        defaults:
            run:
                working-directory: apps/worker

        runs-on: ubuntu-latest

        services:
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                  version: 10
                  run_install: false

            - name: Copy test env
              run: cp .env.test .env

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: pnpm install

            - name: Run Prisma generate
              run: pnpm prisma generate

            - name: Run tests
              run: pnpm test

            - name: Build project
              run: pnpm run build

    # deploy:
    #     runs-on: ubuntu-latest
    #     needs: build
    #     if: github.ref == 'refs/heads/master'
